# Backend and managed Postgres; host frontend/app.py separately on Streamlit.
databases:
  - name: sentinelguard-postgres
    databaseName: sentinelguard
    user: sentinelguard
    plan: basic-256mb
services:
  - type: web
    name: sentinelguard-api
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sentinelguard-postgres
          property: connectionString
      - key: SENTINELGUARD_API_KEY
        sync: false
